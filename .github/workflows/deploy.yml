name: Build and Deploy Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案原始碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安裝專案依賴
        run: npm ci

      - name: 圖片快取機制
        id: cache-images
        uses: actions/cache@v4
        with:
          path: |
            2026/images/**/*-*.webp
            2026/images/*-*.webp
            2026/images/*.webp
            2026/.optimize-cache.json
          key: images-webp-${{ hashFiles('2026/images/**/*.jpg', '2026/images/**/*.jpeg', '2026/images/**/*.png', '2026/images/*.png') }}
          restore-keys: |
            images-webp-

      - name: 執行圖片優化與轉碼（JPG / PNG -> 多尺寸 WebP）
        run: npm run optimize:images

      - name: 執行資料與結構防呆驗證
        run: npm run check:2026

      - name: 執行靜態頁面與 OG 圖生成
        run: npm run generate:2026

      - name: 設定 GitHub Pages 環境
        uses: actions/configure-pages@v5

      - name: 上傳部署成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 發布至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
