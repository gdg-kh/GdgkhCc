<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="../../../" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL}}" />
    <meta name="theme-color" content="" data-gk-token-color="--gk-blue" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{{OG_TYPE}}" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:image:secure_url" content="{{OG_IMAGE}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{TITLE}}" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:site_name" content="{{SITE_NAME}}" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="article:publisher" content="https://www.facebook.com/GDGKaohsiung" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="{{CANONICAL}}" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />
    <meta name="twitter:image:alt" content="{{TITLE}}" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <script type="application/ld+json">
      {{JSON_LD}}
    </script>
    <script>
      window.__GK_AUTO_OPEN = { type: '{{TYPE}}', id: '{{ID}}' };
    </script>
    <script type="module" src="assets/js/main.js"></script>
  </head>
  <body class="gk-loading">
    <a href="#gk-main" class="gk-skip-link">跳到主要內容</a>

    <header id="gk-nav" role="banner"></header>

    <section id="gk-hero" class="gk-hero">
      <div class="gk-hero-inner">
        <h1 class="gk-hero-title" id="gk-hero-title"></h1>
        <p class="gk-hero-date" id="gk-hero-date"></p>
        <p class="gk-hero-venue" id="gk-hero-venue"></p>
        <div class="gk-hero-action-group">
          <div class="gk-hero-actions" id="gk-hero-actions"></div>
          <div class="gk-hero-countdown" id="gk-hero-countdown" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <main id="gk-main">
      <section id="section-about" class="gk-section" data-section-id="about">
        <h2 class="gk-section-title" id="section-about-title"></h2>
        <div id="gk-about"></div>
        <div id="gk-sponsor-marquee"></div>
        <div id="gk-home-cards"></div>
      </section>

      <section id="section-speakers" class="gk-section" data-section-id="speakers">
        <h2 class="gk-section-title" id="section-speakers-title"></h2>
        <div id="gk-speakers"></div>
      </section>

      <section id="section-agenda" class="gk-section" data-section-id="agenda">
        <h2 class="gk-section-title" id="section-agenda-title"></h2>
        <div id="gk-agenda"></div>
      </section>

      <section id="section-virtual" class="gk-section" data-section-id="virtual">
        <h2 class="gk-section-title" id="section-virtual-title"></h2>
        <div id="gk-virtual"></div>
      </section>

      <section id="section-staff" class="gk-section" data-section-id="staff">
        <h2 class="gk-section-title" id="section-staff-title"></h2>
        <div id="gk-staff"></div>
      </section>

      <section id="section-thanks" class="gk-section" data-section-id="thanks">
        <h2 class="gk-section-title" id="section-thanks-title"></h2>
        <div id="gk-thanks"></div>
      </section>

      <section id="section-booths" class="gk-section" data-section-id="booths">
        <h2 class="gk-section-title" id="section-booths-title"></h2>
        <div id="gk-booths"></div>
      </section>
    </main>

    <footer id="gk-footer" role="contentinfo"></footer>

    <div id="gk-modal-root"></div>

    <noscript>
      <article class="gk-share-fallback">{{BODY_CONTENT}}</article>
      <p class="gk-noscript">
        本網站需要 JavaScript 才能正常運作，請開啟瀏覽器的 JavaScript 功能。
      </p>
    </noscript>
  </body>
</html>
