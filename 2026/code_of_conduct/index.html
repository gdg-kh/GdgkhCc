        function resolvePath(obj, keyPath) {
          return keyPath
            .split('.')
            .reduce((acc, key) => (acc && acc[key] !== undefined ? acc[key] : ''), obj);
        }

        function detectInitialLang() {
          try {
            const params = new URLSearchParams(window.location.search);
            const qLang = params.get('lang');
            if (qLang && SUPPORTED.includes(qLang)) {
              return qLang;
            }
          } catch {
            // ignore
          }
          try {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored && SUPPORTED.includes(stored)) {
              return stored;
            }
          } catch {
            // ignore
          }
          const nav = String(
            (typeof navigator !== 'undefined' && navigator.language) || ''
          ).toLowerCase();
          if (nav.startsWith('ja')) {
            return 'ja';
          }
          if (nav.startsWith('en')) {
            return 'en';
          }
          return 'zh-Hant';
        }

        function applyLang(lang, persist) {
          const code = SUPPORTED.includes(lang) ? lang : 'zh-Hant';
          const dict = TRANSLATIONS[code] || TRANSLATIONS['zh-Hant'];
          document.documentElement.lang = code;
          document.title = dict.pageTitle;

          const nodes = document.querySelectorAll('[data-coc]');
          for (const node of nodes) {
            const key = node.getAttribute('data-coc');
            if (key) {
              node.textContent = resolvePath(dict, key);
            }
          }

          const buttons = document.querySelectorAll('.gk-coc-lang-btn');
          for (const btn of buttons) {
            const isCurrent = btn.getAttribute('data-lang') === code;
            btn.setAttribute('aria-pressed', isCurrent ? 'true' : 'false');
          }

          if (persist) {
            try {
              localStorage.setItem(STORAGE_KEY, code);
            } catch {
              // ignore
            }
          }
        }

        const buttons = document.querySelectorAll('.gk-coc-lang-btn');
        for (const btn of buttons) {
          btn.addEventListener('click', () => {
            const targetLang = btn.getAttribute('data-lang');
            applyLang(targetLang, true);
          });
        }

        applyLang(detectInitialLang(), false);
      })();
