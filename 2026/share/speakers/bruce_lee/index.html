    <noscript>
      <article class="gk-share-fallback"><h1>李冠緯</h1><p class="gk-share-affiliation">Full-stack Developer &amp; Community Organizer · WordPress Taiwan Community</p><img src="https://gdgkh.cc/2026/images/speakers/bruce_lee.jpg" alt="李冠緯" width="480" height="480" loading="lazy" /><div class="gk-share-bio"><p>李小胖 Bruce Lee，哈拉設計創辦人、全端開發者，擁有超過 10 年網站開發與自由接案經驗，長期投入 WordPress、Web 開發、AI 與自動化應用。目前為 WordPress 台北小聚主辦人及 GDG Taipei Organizer，持續參與技術社群與開源活動。近年專注於 AI Agent、WebMCP、生成式 AI 與開發工作流，探索如何讓 AI 從「回答問題」進一步理解網站、操作工具，並真正參與產品開發與日常工作流程。</p></div><section class="gk-share-session"><h2>議程：WebMCP：讓 AI 知道你的網站可以怎麼操作</h2><p>隨著 AI Agent 開始能理解網頁、呼叫工具並執行任務，網站也需要從「給人操作」進一步走向「讓 AI 知道可以怎麼操作」。</p><p>這場分享將介紹 WebMCP 的核心概念，以及它如何讓網站把可執行的功能，以更結構化的方式提供給 AI Agent。從表單填寫、搜尋、資料查詢，到觸發網站內的實際操作，AI 不再只能猜測頁面上的按鈕，而是能理解網站提供了哪些能力，以及該如何正確使用。</p><p>現場也會透過實際案例展示 WebMCP 的整合方式，並分享如何在既有網站與 Web 應用中導入，讓你的網站開始具備「AI 可操作」的能力。</p></section><ul class="gk-share-links"><li><a href="https://supergud.github.io/" rel="noopener nofollow">個人網站</a></li><li><a href="https://www.facebook.com/supergud.sf" rel="noopener nofollow">Facebook</a></li><li><a href="https://www.linkedin.com/in/bruce-lee-supergud/" rel="noopener nofollow">LinkedIn</a></li></ul><p><a href="https://gdgkh.cc/2026/">回到首頁</a></p></article>
