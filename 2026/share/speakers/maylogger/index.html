    <noscript>
      <article class="gk-share-fallback"><h1>設計師勞哥</h1><p class="gk-share-affiliation">Founder and Design Engineer · SOTA Design</p><img src="https://gdgkh.cc/2026/images/speakers/maylogger.jpg" alt="設計師勞哥" width="480" height="480" loading="lazy" /><div class="gk-share-bio"><p>設計師勞哥 maylogger（formerly Even Wu），擁有超過 20 年的設計與數位產品開發經驗，現為 SOTA Design 創辦人。曾任 Gogoro Digital Design Lead、臺北市政府數位服務設計顧問，以及實踐大學 UI/UX 專業講師。</p><p>跨足使用者體驗、產品設計與前端工程，長期參與大型網站、數位服務及複雜產品系統的設計與開發。曾參與科技、智慧交通、網路媒體、公共服務、文化創意及教育科技等不同產業領域的數位產品與使用者體驗設計。</p></div><section class="gk-share-session"><h2>議程：當設計遇到 AI — 末日崛起</h2><p>設計師的三種生存模式：一個人、一間公司、一個部門</p><p>AI 時代，從個人創作、接案經營到企業設計管理的生存策略。</p><p>當設計不再只是把東西做好，設計師究竟還能成為什麼？</p><p>本場講座邀請三位身處不同位置的設計工作者，從第一線設計師、設計公司經營者到大型企業設計主管，分享各自在創作實務、商業經營與組織管理上的經驗與挑戰。</p><p>透過三種不同的職涯視角，探討誰來決定好的設計、如何在理想與現實之間取得平衡，以及 AI 浪潮如何重新定義設計工作的價值。</p><p>當一個人、一間公司與一個部門面對相同的設計問題，會做出什麼不同的選擇？一起重新思考設計師的角色、價值與未來的可能性。</p></section><ul class="gk-share-links"><li><a href="https://sota.design" rel="noopener nofollow">SOTA Design</a></li><li><a href="https://www.threads.net/@maylogger_designer" rel="noopener nofollow">Threads</a></li><li><a href="https://www.facebook.com/maylogger/" rel="noopener nofollow">Facebook</a></li><li><a href="https://www.linkedin.com/in/evenwu/" rel="noopener nofollow">LinkedIn</a></li></ul><p><a href="https://gdgkh.cc/2026/">回到首頁</a></p></article>
