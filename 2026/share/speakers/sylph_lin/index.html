      <article class="gk-share-fallback"><h1>林政君</h1><img src="https://gdgkh.cc/2026/images/speakers/sylph_lin.jpg" alt="林政君" width="480" height="480" loading="lazy" /><div class="gk-share-bio"><p>Sylph 是一位熱情的新興技術佈道者，專注於探索雲端和 AI 的前沿應用的無限可能，相信透過新興技術的與真實應用的連結，可以協助產業轉型與團隊升級。Sylph 在Google協助大中華區的開發者與合作夥伴建立可複製的AI解決方案，協助銜接AI解決方案落地並創造商業價值。</p><p>Sylph 擅長AI解決方案、雲端技術架構規劃、產品規劃與管理、技術團隊管理等相關工作，擁有豐富的跨國團隊管理與國際專案實務經驗。</p></div><section class="gk-share-session"><h2>議程：代理影片生成的新時代</h2><p>在寫程式的時候，我們經歷了自主撰寫到Coding Agent的過程。影片生成現在也在經歷一樣的路徑，這個講題會介紹透過Antigravity來當作影片生成的Agent，讓你跳脫出繁瑣的工作，聚焦在導演的角度來處理影片</p></section><ul class="gk-share-links"><li><a href="https://www.linkedin.com/in/sylphlin/" rel="noopener nofollow">LinkedIn</a></li></ul><p><a href="https://gdgkh.cc/2026/">回到首頁</a></p></article>
