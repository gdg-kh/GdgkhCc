      <article class="gk-share-fallback"><h1>史蒂夫•葉</h1><p class="gk-share-affiliation">技術處長 · 精誠集團</p><img src="https://gdgkh.cc/2026/images/speakers/steve_yeh.jpg" alt="史蒂夫•葉" width="480" height="480" loading="lazy" /><div class="gk-share-bio"><p>現任精誠集團技術處長，創立 I.D.E.A. 團隊並率先導入 FDE（前線部署工程）與 AI 驅動工作流，致力於 UI/UX 策略與系統架構的深度整合。曾創立 Able Studio（獲 2020 德國國家設計獎），帶領團隊主持千萬級「勞保局 e 化服務系統」重構。具備豐富跨領域實戰經驗，涵蓋金融交易系統、半導體供應鏈 CPQ 平台、零售與娛樂 POS/ERP/SCO 系統、FMCG 食品巨頭經銷數據整合，以及製造業 ERP 升級 POC 等高難度專案。獲選為 Gamma 全球創始品牌大使，相信透過深刻洞察與高確定性架構執行力，能持續為企業創造成長。</p></div><ul class="gk-share-links"><li><a href="https://www.facebook.com/steven.yeh" rel="noopener nofollow">Facebook</a></li><li><a href="https://www.linkedin.com/in/steven0128" rel="noopener nofollow">LinkedIn</a></li></ul><p><a href="https://gdgkh.cc/2026/">回到首頁</a></p></article>
