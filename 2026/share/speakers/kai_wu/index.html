      <article class="gk-share-fallback"><h1>吳楷鈞</h1><p class="gk-share-affiliation">GDGoC NSYSU ex Organizer · GDGoC NSYSU</p><img src="https://gdgkh.cc/2026/images/speakers/kai_wu.jpg" alt="吳楷鈞" width="480" height="480" loading="lazy" /><div class="gk-share-bio"><p>大家好我是 Kai，中山資工大四，目前在實驗室做最佳化與 AI 研究。近期在鑽研如何讓 Agent 更穩定地執行多步驟任務，很期待在 DevFest Kaohsiung 與大家見面，分享 Google ADK 的實務開發心得與技巧！</p></div><section class="gk-share-session"><h2>議程：從臨場發揮到穩定交付:
利用 Antigravity 構建穩定、可重用的Google ADK 個人助理</h2><p>最近AI界再度出現「AGI 時代已經來臨」的社群貼文。但當我們把AI帶回到日常應用時，我們依舊可以看見 AI 在工具調用和多步驟任務中「迷路」：遺漏步驟、重複執行，或在任務交接後偏離原本的目標。如何讓 AI 持續、可靠地完成工作，成為應用開發中值得關注的課題。</p><p>如果把主代理（Main Agent）想像為主管，子代理（Sub-agent）就像各有所長的團隊成員。主管可以依需求分派工作，組合出不同的任務流程。但隨著任務變得複雜，團隊也需要清楚的分工、交接規則與驗收標準。例如：當個人助理接到「蒐集資料、整理重點，再產出報告」的需求，每個階段都需要明確知道應接收什麼、交付什麼，以及遇到問題時如何處理。若這些規則不夠明確，即使成員各具能力，整體流程仍可能出現落差。</p><p>這個的議程將會以 Google ADK 個人助理為例，運用 Antigravity 輔助開發，探討如何將常用的多步驟任務封裝成「穩定、可重用」的任務工具包。以明確的輸入輸出、可控的流程編排和錯誤處理與結果驗證，讓Main Agent 可以依照需求調用經過測試的任務模組，如同主管調度具備標準作業流程的團隊，在保有彈性的同時，提升複雜任務的執行可靠性，逐步打造能融入日常工作的 AI 個人助理。</p></section><ul class="gk-share-links"><li><a href="https://www.linkedin.com/in/kai-chun-wu-b871b3314/" rel="noopener nofollow">LinkedIn</a></li><li><a href="https://www.instagram.com/gdg.nsysu/" rel="noopener nofollow">GDGoC NSYSU Instagram</a></li></ul><p><a href="https://gdgkh.cc/2026/">回到首頁</a></p></article>
