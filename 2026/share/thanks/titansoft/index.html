      <article class="gk-share-fallback"><h1>新加坡商鈦坦科技</h1><img src="https://gdgkh.cc/2026/images/thanks/titansoft.png" alt="新加坡商鈦坦科技" width="480" height="480" loading="lazy" /><div class="gk-share-bio"><p>鈦坦科技，是一間總部位於新加坡的軟體開發公司，提供線上軟體平台客製開發與維護，以及代理 Atlassian 旗下產品 Jira Software &amp; Confluence、線上視覺化白板 Miro，以自身實際使用經驗提供一站式導入服務。身處快速變動的軟體產業，我們採用敏捷開發，同時將敏捷思維注入公司文化，目的是快速、靈活地應對客戶和市場需求的變化，在多年導入及迭代的經驗下，我們也開始提供企業客製化敏捷課程及顧問諮詢服務。</p><p>鈦坦在台北、台中、高雄都有辦公室，而三地最大的共同點，就是舒適開放的大空間，以及擺放著各式酒類的吧台。我們相信員工都是「成年人」，只要能夠將事情做好做完，想喝酒、玩桌遊、打電動都是沒有問題的，因為我們相信夥伴能自主安排、對工作負責！</p></div><ul class="gk-share-links"><li><a href="https://gotica.io/鈦坦全頻道/DevFest" rel="noopener nofollow">鈦坦全頻道</a></li><li><a href="https://titansoft.com/" rel="noopener nofollow">官網</a></li></ul><p><a href="https://gdgkh.cc/2026/">回到首頁</a></p></article>
