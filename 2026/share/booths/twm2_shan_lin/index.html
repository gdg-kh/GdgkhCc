      <article class="gk-share-fallback"><h1>從第一線應變到企業治理：30 天打造資安溝通與營運韌性</h1><p class="gk-share-affiliation">Shan Lin · 台灣路由網路實驗中心</p><img src="https://gdgkh.cc/2026/images/booths/twm2_shan_lin.png" alt="從第一線應變到企業治理：30 天打造資安溝通與營運韌性" width="480" height="480" loading="lazy" /><div class="gk-share-bio"><p>「Tools change. The way stays. 工具會變,但資安與人溝通、與業務共好的道不會變。」</p><p>本書結合 18 年第一線應變與企業治理實務,把複雜的資安威脅、供應鏈風險與弱點,轉化為營運層與決策層聽得懂的商業語言。全書分成四大模組,共 30 天:</p><p>破局與戰略(Day 1–7): FAIR 風險量化、董事會簡報、DevSecOps 溝通心理學、合規與實質防禦、企業資安溝通矩陣。</p><p>實戰與韌性(Day 8–15): 事故應變黃金 72 小時、法務與公關協作、CTI 威脅情資落地、現代 SOC 運營與自動化。</p><p>架構與治理(Day 16–23): 弱點優先順序、零信任、第三方與供應鏈風險、影子 IT、資料分類、兵棋推演與 BCP。</p><p>永續與生態(Day 24–30): 資安文化、職涯橫向能力、同行人脈、生成式 AI 的攻防變局。</p><p>本書基於「知識共享、專業人脈、廠商中立、持續學習」四大心法,寫給資安從業人員與 IT 主管,協助打破溝通壁壘,打造兼具技術深度與營運韌性的企業資安防務。</p></div><section class="gk-share-session"><h2>作者介紹</h2><p>目前為企業的資安分析師，專注於企業與產品資安防禦體系的維運，工作涵蓋威脅情資分析（CTI）、攻擊手法研究（TTPs）、資產狀態監測與事故處理應變。具備 18 年的資安與網路基礎建設整合經驗，歷經經銷商、代理商、資安原廠，一路走到企業端。同時擔任國防工業發展基金會評鑑委員，協助驗證國防供應鏈的資安防護韌性。</p><p>在社群方面，目前擔任 vLAB Online 資安社群品牌 PM，負責活動規劃與營運，策劃《資安懂事掌》、《誰來 InSide》、《資安知不知》等帶狀線上活動，以及「一日藍隊實戰工作坊」與大型活動「資安社群嘉年華」。同時參與台灣數位安全聯盟（TWCSA）的社群管理，並推廣 OWASP 與 Meetup 社群日活動。</p><p>致力於透過這些系列活動建立資安技術與大眾、決策層與實務者之間的對話橋樑，讓資安不再只是技術問題，而是整體治理與文化的一環。</p></section><p><a href="https://gdgkh.cc/2026/">回到首頁</a></p></article>
