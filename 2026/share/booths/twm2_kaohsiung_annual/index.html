      <article class="gk-share-fallback"><h1>高雄社群年刊 創刊號</h1><p class="gk-share-affiliation">總編輯：維廷 Andy</p><p class="gk-share-affiliation">設計：饅頭</p><p class="gk-share-affiliation">共同創作：GDG Kaohsiung、開發者 Buffet、Second Space、K.NET、PyLadies Kaohsiung、vLAB Online、UIUX Kaohsiung</p><p class="gk-share-affiliation">DevFest 2026 高雄場 報到台</p><img src="https://gdgkh.cc/2026/images/booths/twm2_kaohsiung_annual.png" alt="高雄社群年刊 創刊號" width="480" height="480" loading="lazy" /><div class="gk-share-bio"><p>匯集高雄活躍的技術與交流社群</p></div><section class="gk-share-session"><h2>作者介紹</h2><p>年刊總編輯的話</p><p>大家好，我是高雄社群年刊總編維廷 Andy。這次高雄社群年刊創刊號能順利出版，首先要感謝饅頭彙整排版和視覺設計，再來是每個高雄社群的內容貢獻，最後是我太太，因為她能忍受我們一起出國玩的時候我晚上都在民宿趕年刊的稿和 DevFest 2026 高雄場的事。</p><p>我個人覺得，高雄社群對社群咖來說是個甜蜜點，因為每個領域都能找到對應的社群，而且社群數量適中，想要把全社群跑透是能做到的事情；更難得的是每個社群的組織者和會眾們都是燃燒自己的熱情在經營和參與，所以我想要把這個能量記錄起來，最後歡迎大家多多參加高雄社群活動！</p><p>--</p><p>封面設計的話</p><p>大家好，我是負責這本社群年刊封面的饅頭！自己在高雄參與社群活動大概兩三年了，這幾年跑了各個社群的活動，最大的收穫就是認識了一大群超厲害的工程師與設計師大大，不僅接觸到各種新技術，還激盪出許多有趣的想法，真的非常好玩！這次很榮幸能把今年高雄各社群的精采活動收錄成冊。翻完年刊如果有心動，別猶豫，未來的活動直接衝就對了！</p></section><p><a href="https://gdgkh.cc/2026/">回到首頁</a></p></article>
